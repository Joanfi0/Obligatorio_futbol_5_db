{% extends 'base.html' %}
{% block content %}
    <p>
        Accede al torneo con tu cuenta de administrador o planillero.
    </p>
    <form method="post" class="panel narrow">
        <input type="hidden" name="csrf" value="{{session.csrf}}">
        <label>
            Correo
            <input name="correo" type="email" maxlength="254" required autocomplete="username">
        </label>
        <label>
            Contrasena
            <input name="password" type="password" required autocomplete="current-password">
        </label>
        <button>
            Ingresar
        </button>
    </form>
{% endblock %}
