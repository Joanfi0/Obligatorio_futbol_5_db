services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Copiar .env.example a .env}
      TZ: America/Montevideo
    volumes:
      - torneo_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 40
    ports:
      - "127.0.0.1:3307:3306"
  app:
  
    build: .
    volumes:
      - .:/app
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: torneo_ucu
      DB_AUTH_PASSWORD: ${DB_AUTH_PASSWORD}
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD}
      DB_PLAN_PASSWORD: ${DB_PLAN_PASSWORD}
      SECRET_KEY: ${SECRET_KEY:?Definir SECRET_KEY}
      TZ: America/Montevideo
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  torneo_data:
